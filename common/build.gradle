plugins {
    id 'java-library'
}

dependencies {
    compileOnly files(rootProject.file(findProperty('coreJar') ?: '../core/Kokonut-Core/build/libs/Kokonut-Core-cbt-1.0.jar'))
    api 'commons-io:commons-io:2.22.0'
    api 'org.apache.commons:commons-text:1.15.0'
    api 'net.william278:mapdataapi:2.0'
    api 'org.json:json:20250517'
    api 'com.google.code.gson:gson:2.14.0'
    api 'com.fatboyindustrial.gson-javatime-serialisers:gson-javatime-serialisers:1.1.2'
    api 'de.exlll:configlib-yaml:4.8.1'
    api 'net.william278:DesertWell:2.0.4'

    compileOnlyApi 'net.william278.toilet:toilet-common:1.1.2'

    compileOnly 'net.william278.uniform:uniform-common:1.4.0'
    compileOnly 'com.mojang:brigadier:1.1.8'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'net.kyori:adventure-api:4.25.0'
    compileOnly 'net.kyori:adventure-platform-api:4.4.0'
    compileOnly "net.kyori:adventure-text-serializer-plain:4.25.0"
    compileOnly "net.kyori:adventure-text-minimessage:4.25.0"
    compileOnly 'com.google.guava:guava:33.7.1-jre'
    compileOnly "io.lettuce:lettuce-core:$lettuce_version"
    compileOnly "org.apache.commons:commons-pool2:$commons_pool_version"
    compileOnly "com.mysql:mysql-connector-j:$mysql_driver_version"
    compileOnly "org.xerial.snappy:snappy-java:$snappy_version"

    testImplementation "org.xerial.snappy:snappy-java:$snappy_version"
    testImplementation 'com.google.guava:guava:33.7.1-jre'
    testImplementation 'net.kyori:adventure-text-minimessage:4.25.0'
    testCompileOnly 'de.exlll:configlib-yaml:4.8.1'
    testCompileOnly 'org.jetbrains:annotations:26.1.0'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}